services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linktree}
      POSTGRES_USER: ${POSTGRES_USER:-linktree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linktree}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linktree}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    profiles: ["full-docker"]
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      DEBUG: ${DEBUG:-False}
      POSTGRES_DB: ${POSTGRES_DB:-linktree}
      POSTGRES_USER: ${POSTGRES_USER:-linktree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linktree}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
